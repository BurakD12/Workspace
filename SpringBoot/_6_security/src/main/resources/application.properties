spring.application.name=_6_security

spring.datasource.url=jdbc:postgresql://localhost:5432/bookstore_lab
spring.datasource.username=postgres
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Lab 6: password for the ADMIN account seeded at startup by AdminUserSeeder.
# Default is "admin12345" (seeded credentials: admin / admin12345). Override in real
# deployments; the seeder only creates the user when it does not already exist.
app.security.admin-password=admin12345
